# ==========================================================================
# YOUR APPLICATION PROFILE
# Copy this file to profile.yaml (that filename is gitignored, so your real
# details never get committed) and fill it in with real facts. Every answer
# the script gives on a form is generated from this file -- nothing here
# should be something you'd be uncomfortable being asked about in an
# interview.
# ==========================================================================

target_roles:
  - "Backend Developer"
  - "Backend Enginner"
  - "Nodejs Developer"
  - "Frontend Developer"
  # add every role variant you actually want to be found under

# Controls how strictly a job's title must match the role you searched for.
# Naukri's own search is loose (e.g. "Data Engineer" can surface completely
# unrelated titles), so this filter re-checks the title itself. A card is
# kept only if its title contains at least one of these words. If a role
# isn't listed here, the script falls back to using the role's own words
# (minus generic terms like "engineer"/"developer").
role_required_keywords:
  "Frontend Developer": ["frontend developer"]
  "Backend Developer": ["backend developer", "backend engineer"]

current_city: "Hyderabad"
relocate_cities: ["Bengalore", "Mumbai", "Pune", "Chennai"]          # e.g. ["Hyderabad", "Pune"] -- leave empty if you won't relocate
work_mode: "onsite_or_hybrid"  # onsite_or_hybrid | remote_only | flexible
night_shift_ok: false
weekend_ok: false

total_experience_years: 3.5
current_employer: "Miraki Technologies"
current_title_official: "Full Stack Developer"
current_title_functional: "Full Stack Web Developer working on React.js frontend development, Node.js backend development, REST APIs, MongoDB database integration, authentication, bug fixing, and application maintenance."
notice_period_days: 10                         # set to your real, current notice period
immediately_available: true

current_ctc_lpa: 350000        # fill in your real number, in Lakhs Per Annum
expected_ctc_lpa: 800000
ctc_disclosure_policy: "negotiable"   # negotiable | real_numbers

highest_qualification: "BCA, Shidharrtha Degree Collage"
certifications: []           # e.g. ["AWS Certified Developer", "Azure Fundamentals"]

skills_primary:              # things you'd rate yourself strongly on
   -"JavaScript"
  - "Node.js"
  - "Express.js"
  - "MongoDB"
  - "React.js"
  - "REST APIs"
  - "JWT"
  - "Git"
  

skills_adjacent:             # real but lighter exposure -- answer these modestly, never round up
  - "python"
  - "java"
  

work_history_narrative: |
    I work as a Full Stack Web Developer, focusing on React.js for frontend development
    and Node.js, Express.js, and MongoDB for backend development. I develop and maintain
    REST APIs, implement authentication and authorization workflows, integrate databases
    and file-upload features, and troubleshoot application issues. I also work on existing
    application enhancements, bug fixing, testing, and improving application performance.

company_exclude: ["Mirak Technologies"]          # e.g. ["Your Current Employer"] -- filter rule, not a fact
company_include_only: []     # leave empty to not restrict

seniority_floor_years: 0
seniority_ceiling_years: 3
job_freshness_days: 3          # Naukri's "freshness" filter -- only jobs posted in the last N days

salary_floor_lpa: null

stop_after_n_applications: 10
pace_seconds_between_actions: 5

# How long to wait for you to type an answer when the script hits a
# question it can't answer safely on its own (personal details like DOB,
# or anything the AI genuinely doesn't know from your profile). If you
# don't respond in time, that one listing is skipped -- the run continues.
human_input_timeout_seconds: 120

# How many search-result pages to go through per role before moving to the
# next role (or stopping, if stop_after_n_applications is reached first).
max_pages_per_role: 5

# How the browser window behaves while running:
#   "visible"   -- normal window, you can watch it (best for early runs / debugging)
#   "minimized" -- a real browser still opens and does everything the same way,
#                  but starts minimized to the taskbar so it's out of your way
#   "headless"  -- no window at all, fastest, but a genuinely fake/invisible
#                  browser is somewhat easier for a site to detect as a bot
#                  than a real (even minimized) one -- slightly higher risk
browser_mode: "minimized"

resume_file_name: "Kommana_Vikas.pdf"   # must match the filename already uploaded to Naukri/LinkedIn, and sit in this same project folder
